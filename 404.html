<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecionando — marcaumdev</title>
    <script>
      (() => {
        const requestedRoute = `${window.location.pathname}${window.location.search}${window.location.hash}`;
        const redirectUrl = new URL("/", window.location.origin);

        redirectUrl.searchParams.set("gh-pages-route", requestedRoute);
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para o portfólio…</p>
  </body>
</html>
